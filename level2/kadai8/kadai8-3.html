<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>お問い合わせフォーム演習</title>
  </head>

  <body>
    <!--
フォームの改善内容

現時点の自身の知識では、thankyou.htmlを作成し、
送信ボタンを押した後に「お問い合わせありがとうございます！」と
表示されるページへ遷移させる方法を考え、実装しました。

また、自身で調べたところ、実際のWebサイトでは、
PHPなどを使用してフォームの送信処理を行った後に、
完了ページへ遷移させる方法があるようです。

今回は、現在学習しているHTMLの知識を使って、
送信後に完了ページへ遷移する流れを作成しました。
-->

    <h1>お問い合わせフォーム</h1>

    <form action="thankyou.html" method="get">
      <div>
        <label for="name"> お名前 <span style="color: red">*</span> </label>
        <br />
        <input
          type="text"
          id="name"
          name="user_name"
          placeholder="山田太郎"
          required
        />
      </div>

      <div>
        <label for="email">
          メールアドレス <span style="color: red">*</span>
        </label>
        <br />
        <input
          type="email"
          id="email"
          name="user_email"
          placeholder="info@example.com"
          required
        />
      </div>

      <div>
        <label for="message">
          お問い合わせ内容 <span style="color: red">*</span>
        </label>
        <br />
        <textarea
          id="message"
          name="user_message"
          rows="5"
          placeholder="お問い合わせ内容を具体的にご記入ください。"
          required
        ></textarea>
      </div>

      <div>
        <p>性別:</p>

        <input type="radio" id="gender_male" name="gender" value="male" />
        <label for="gender_male">男性</label>

        <input type="radio" id="gender_female" name="gender" value="female" />
        <label for="gender_female">女性</label>

        <input
          type="radio"
          id="gender_no_answer"
          name="gender"
          value="no_answer"
          checked
        />
        <label for="gender_no_answer">回答しない</label>
      </div>

      <div>
        <p>興味のある分野:</p>

        <input
          type="checkbox"
          id="interest_webdesign"
          name="interests[]"
          value="webdesign"
        />
        <label for="interest_webdesign">Webデザイン</label>

        <input
          type="checkbox"
          id="interest_programming"
          name="interests[]"
          value="programming"
        />
        <label for="interest_programming">プログラミング</label>

        <input
          type="checkbox"
          id="interest_marketing"
          name="interests[]"
          value="marketing"
        />
        <label for="interest_marketing">マーケティング</label>
      </div>

      <div>
        <input type="submit" value="送信する" />
      </div>
    </form>
  </body>
</html>
