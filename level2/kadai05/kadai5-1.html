    <h1>ソフトバンクの空飛ぶ基地局<strong>HAPS</strong> 8月に日本で飛行試験</h1>
    <p>
      ソフトバンクは、“空飛ぶ基地局”として開発を進めている「HAPS」の試験サービスを8月中旬以降に日本国内で実施する。
    </p>
    <p>災害時の運用を想定したもので、日数は7日〜10日間を予定。</p>
    <p>
      場所は東北や四国、九州など複数の候補があり、気象条件などで実施場所を決定する。
    </p>
    <p>
      今回の試験サービスは「プレ商用サービス」と位置付けており、2027年に商用サービスの開始を予定している。
    </p>
